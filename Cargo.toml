[package]
name = "rusty-engine-voxels"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Standalone Rusty Engine voxel conversion and Studio experimentation project"
license = "MIT"
default-run = "voxel-lab"

[lib]
name = "rusty_engine_voxels"
path = "src/lib.rs"

[[bin]]
name = "voxel-lab"
path = "src/bin/voxel-lab.rs"

[[bin]]
name = "voxel-density-lab"
path = "src/bin/voxel-density-lab.rs"

[[bin]]
name = "voxel-kit-lab"
path = "src/bin/voxel-kit-lab.rs"

[[bin]]
name = "rusty-engine-voxels-studio-adapter"
path = "src/bin/studio-adapter.rs"

[[bin]]
name = "textured-voxel-evidence"
path = "src/bin/textured-voxel-evidence.rs"

[dependencies]
gif = "0.13"
png = "0.17"
rusty-engine = { git = "https://github.com/FuzzySlipper/rusty-engine", branch = "main" }
rusty-engine-voxels-revision = { path = "tools/engine-revision" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
