[package]
name = "rusty-engine-voxels"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Standalone Rusty Engine voxel conversion and Studio experimentation project"
license = "MIT"
default-run = "voxel-lab"

[lib]
name = "rusty_engine_voxels"
path = "src/lib.rs"

[[bin]]
name = "voxel-lab"
path = "src/bin/voxel-lab.rs"

[[bin]]
name = "rusty-engine-voxels-studio-adapter"
path = "src/bin/studio-adapter.rs"

[[bin]]
name = "textured-voxel-evidence"
path = "src/bin/textured-voxel-evidence.rs"

[dependencies]
asset-catalog = { git = "https://github.com/FuzzySlipper/rusty-engine", rev = "c02754812d53df5363c9e6475c685c54e532f5e5" }
core-assets = { git = "https://github.com/FuzzySlipper/rusty-engine", rev = "c02754812d53df5363c9e6475c685c54e532f5e5" }
core-space = { git = "https://github.com/FuzzySlipper/rusty-engine", rev = "c02754812d53df5363c9e6475c685c54e532f5e5" }
core-voxel = { git = "https://github.com/FuzzySlipper/rusty-engine", rev = "c02754812d53df5363c9e6475c685c54e532f5e5" }
gif = "0.13"
render-model = { git = "https://github.com/FuzzySlipper/rusty-engine", rev = "c02754812d53df5363c9e6475c685c54e532f5e5" }
render-projection = { git = "https://github.com/FuzzySlipper/rusty-engine", rev = "c02754812d53df5363c9e6475c685c54e532f5e5" }
rusty-engine-voxels-revision = { path = "tools/engine-revision" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
svc-mesh = { git = "https://github.com/FuzzySlipper/rusty-engine", rev = "c02754812d53df5363c9e6475c685c54e532f5e5" }
svc-spatial = { git = "https://github.com/FuzzySlipper/rusty-engine", rev = "c02754812d53df5363c9e6475c685c54e532f5e5" }
svc-volume = { git = "https://github.com/FuzzySlipper/rusty-engine", rev = "c02754812d53df5363c9e6475c685c54e532f5e5" }
voxel-asset = { git = "https://github.com/FuzzySlipper/rusty-engine", rev = "c02754812d53df5363c9e6475c685c54e532f5e5" }
voxel-convert = { git = "https://github.com/FuzzySlipper/rusty-engine", rev = "c02754812d53df5363c9e6475c685c54e532f5e5" }
voxel-object-runtime = { git = "https://github.com/FuzzySlipper/rusty-engine", rev = "c02754812d53df5363c9e6475c685c54e532f5e5" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
