[package]
name = "rusty-engine-voxels"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Standalone Rusty Engine voxel conversion and Studio experimentation project"
license = "MIT"
default-run = "voxel-lab"

[lib]
name = "rusty_engine_voxels"
path = "src/lib.rs"

[[bin]]
name = "voxel-lab"
path = "src/bin/voxel-lab.rs"

[[bin]]
name = "rusty-engine-voxels-studio-adapter"
path = "src/bin/studio-adapter.rs"

[dependencies]
render-model = { git = "https://github.com/FuzzySlipper/rusty-engine", rev = "bf3110c05dc27b7b1e5eeda173fb68857b06749c" }
render-projection = { git = "https://github.com/FuzzySlipper/rusty-engine", rev = "bf3110c05dc27b7b1e5eeda173fb68857b06749c" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
voxel-asset = { git = "https://github.com/FuzzySlipper/rusty-engine", rev = "bf3110c05dc27b7b1e5eeda173fb68857b06749c" }
voxel-convert = { git = "https://github.com/FuzzySlipper/rusty-engine", rev = "bf3110c05dc27b7b1e5eeda173fb68857b06749c" }
voxel-object-runtime = { git = "https://github.com/FuzzySlipper/rusty-engine", rev = "bf3110c05dc27b7b1e5eeda173fb68857b06749c" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
