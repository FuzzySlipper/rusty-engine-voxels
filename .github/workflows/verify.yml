name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      reverse_provider_commit:
        description: Exact Rusty Engine revision that reverse-pins this consumer
        required: false
        type: string

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/verify.sh

  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: ./scripts/verify-studio.sh

  studio-browser:
    if: github.event_name == 'workflow_dispatch' && inputs.reverse_provider_commit != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89
        with:
          components: clippy, rustfmt
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the reverse provider's exact Chromium dependency
        run: pnpm dlx playwright@1.61.1 install --with-deps chromium
      - run: ./scripts/verify-studio-browser.sh "${{ inputs.reverse_provider_commit }}"
