name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Provision adjacent Rusty Engine checkout
        run: git clone --depth 1 https://github.com/FuzzySlipper/rusty-engine.git ../rusty-engine
      - uses: dtolnay/rust-toolchain@1.89
        with:
          components: clippy, rustfmt
      - name: Install Engine webview build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/verify.sh
